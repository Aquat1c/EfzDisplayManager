[Display]
;/* -------------------------------------------------------------------------
; * EFZ DisplayManager - display enhancement mod for Eternal Fighter Zero
; * -Memorial- + Revival. Requires Revival's own Ddraw.dll (supported:
; * 1.02e-era/2020, 1.02f, 1.02g, 1.02h, 1.02i, both 1.02j builds).
; *
; * Install: put this whole folder into the game's mods\ directory
; * (EfzModManager), enable "DisplayManager=1" in EfzModManager.ini.
; * Change settings/remove the DLL with the game closed, then restart.
; * ------------------------------------------------------------------------- */

; 0 = leave the game completely untouched (no hooks installed)
Enabled=1

; Output sizing inside the backbuffer:
;   FitToScreen      - aspect-correct fit (letterboxed) - DEFAULT
;   IntegerScaling   - whole-number multiples (see IntegerScale)
;   CustomResolution - fixed output size (see CustomWidth/Height)
Mode=FitToScreen

; IntegerScaling multiple; 0 = largest that fits the output
IntegerScale=0

; CustomResolution output size (clamped to the output)
CustomWidth=640
CustomHeight=480

; Upscaling filter:
;   Linear - Revival's default (bilinear)
;   Point  - crisp pixels
;   Sharp  - sharp-bilinear shader (see Sharpness)
;   xBR    - xBR-lv2 shader
; Any shader failure falls back to Linear automatically.
Filter=Linear

; Sharp filter strength 10-40 (= 1.0-4.0); higher = crisper, 20 = default.
; Has no effect unless Filter=Sharp.
Sharpness=20

; Letterbox border color (RRGGBB hex)
BackgroundColor=000000

; Alt+Enter / F11 fullscreen target:
;   1 = BORDERLESS fullscreen (default; requires an admitted reset lifecycle)
;   0 = EXCLUSIVE fullscreen (lower latency; needs the CompatLayer when
;       coordinated training/netplay reset-contract builds are loaded)
FullscreenMode=1

; Start in fullscreen at launch (uses FullscreenMode's target)
Fullscreen=0

; Hotkey master switch for Alt+Enter / F11
FullscreenHotkey=1

; VSync: -1 = keep Revival's interval in windowed / IMMEDIATE in exclusive
;         0 = always immediate (lowest latency)
;         1 = vsync on
VSync=-1

; Enable the maximize box on Revival's fixed-size window
WindowAdjustStyle=1

; Sizing border so the window can be dragged by its edges.
; NOTE: while you HOLD a drag, Windows pauses the game (this is also true of
; vanilla Revival). Maximize/restore/snap never pause.
WindowDragResize=1

; Backbuffer follows window maximize/restore/resize (aspect-correct at any
; size; returns to Revival's configured size when the window is restored)
ResizeBackBuffer=1

; Cooperative Reset ownership: each compatible training/netplay build releases
; and recreates its OWN resources through EFZ_QueryOverlayResetApiV1.
; No foreign resources are force-released. An older known overlay without the
; contract blocks voluntary resets. 0 also blocks resets while one is loaded.
CompatLayer=1

; --- diagnostics ---------------------------------------------------------

; Log the first N and then every Nth final-blit observation
LogFirst=6
LogEvery=600

; Test/automation: delay (ms) before a Fullscreen=1 startup request fires
FullscreenDelayMs=0
