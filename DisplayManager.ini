[Display]
; EFZ DisplayManager settings.
; Close the game before changing anything; settings are read at startup.
; Delete this file to get every default back.

; 1 = mod on, 0 = mod completely off.
Enabled=1

; --- Picture --------------------------------------------------------------

; How the 640x480 picture fills the window or screen:
;   FitToScreen      - as big as fits, black bars where needed (default)
;   IntegerScaling   - whole multiples only (2x, 3x, ...): pixel-perfect,
;                      wider bars
;   CustomResolution - a fixed size, set below
Mode=FitToScreen

; IntegerScaling only: the multiple to use. 0 = the largest that fits.
IntegerScale=0

; CustomResolution only: the picture size in pixels.
CustomWidth=640
CustomHeight=480

; Scaling filter:
;   Linear - smooth (Revival's own look, default)
;   Point  - hard, crisp pixels
;   Sharp  - crisp but even; a good choice for big screens
;   xBR    - smoothed pixel art; heavy for laptop graphics above 1080p
; If your graphics card can't run Sharp or xBR, Linear is used.
Filter=Linear

; Sharp only: how crisp, from 10 (soft) to 40 (hard). 20 = default.
Sharpness=20

; Color of the black bars, as RRGGBB (000000 = black).
BackgroundColor=000000

; --- Fullscreen -----------------------------------------------------------

; F11 / Alt+Enter switch fullscreen on and off. 0 = keys do nothing.
FullscreenHotkey=1

; 1 = start the game in fullscreen.
Fullscreen=0

; Fullscreen type:
;   Borderless - a window covering the whole screen (default). Switching to
;                other programs is instant and other mods' menus always show.
;   Exclusive  - the game takes over the screen. With several monitors,
;                usually only the main output supports this.
FullscreenMode=Borderless

; Exclusive only: refresh rate in Hz. 0 = the screen's current rate.
; With VSync=0, 60 Hz is allowed and tearing is expected. VSync=1 requires
; at least 64 Hz; otherwise the existing Borderless fallback applies.
FullscreenRefresh=0

; Exclusive only: 1 = no screen tearing, 0 = lowest delay (may tear).
; Performance depends on the graphics driver.
VSync=0

; Hide the mouse pointer in fullscreen after 2 seconds without movement.
; Moving the mouse shows it again. 0 = always show it.
HideCursor=1

; 1 = the picture reaches the screen sooner in window and borderless mode
; (up to about one frame). Needs Windows 7 or newer; best on Windows 10 and
; 11. Only used on displays of 64 Hz or more: a slower display would slow
; the game down to the screen, so there the classic mode stays on. If the
; game won't start, or other mods' pictures go missing, set this back to 0.
LowLatencyWindow=0

; --- Window ---------------------------------------------------------------

; Enable the window's maximize button.
WindowAdjustStyle=1

; Let the window be resized by dragging its edges. Windows pauses the game
; while you hold an edge; maximizing and snapping never pause it.
WindowDragResize=1

; The picture follows the window size. 0 = keep Revival's fixed size.
ResizeBackBuffer=1

; --- Advanced -------------------------------------------------------------

; Works together with training mode 1.2.5+ and InGameNetplay 0.5.5+ when the
; display changes. Leave at 1. With 0, window resizing stops while one of
; those mods is loaded.
CompatLayer=1

; Preview: reduce graphics pauses on Revival 2020 / original 1.02j.
; Set to 0 if this causes picture problems. Other builds are unchanged.
DynamicUpload=1

; Developer diagnostic capture. Leave at 0 for normal play.
TraceFrames=0

; Log detail for DisplayManager.log: the first N frames, then every Nth
; frame (0 = never). Display changes are always logged.
LogFirst=6
LogEvery=0

; For automated tests: wait this many milliseconds before Fullscreen=1 acts.
FullscreenDelayMs=0
